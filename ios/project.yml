# Projeto Xcode gerado pelo XcodeGen (`xcodegen generate`): o .xcodeproj não vai para o git.
name: GoatRemote
options:
  bundleIdPrefix: cc.slokker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RemoteCore:
    path: RemoteCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  GoatRemote:
    type: application
    platform: iOS
    sources:
      - path: GoatRemote
    dependencies:
      - package: RemoteCore
    info:
      path: GoatRemote/Info.plist
      properties:
        CFBundleDisplayName: GoatRemote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Procurar as TVs e falar com elas na rede de casa.
        NSLocalNetworkUsageDescription: "GoatRemote finds and controls the TVs on your home network."
        NSBonjourServices: [_androidtvremote2._tcp, _companion-link._tcp]
        # A lista de apps vem do GoatLauncher na TV, por http na rede de casa.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goatremote
        PRODUCT_NAME: GoatRemote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets: [GoatRemoteUITests]
  # Testes de interface no simulador contra a TV falsa (tools/AtvTool.java), no workflow "iOS UI tests".
  GoatRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GoatRemote
    info:
      path: UITests/Info.plist
      properties:
        # O teste lê o código da TV falsa em http://127.0.0.1:7000.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goatremote.uitests
        TEST_TARGET_NAME: GoatRemote
        CODE_SIGN_STYLE: Manual
