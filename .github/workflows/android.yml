name: Android

# A app para telemóveis Android: testes do núcleo, o APK e o percurso todo num emulador contra a TV falsa
# (tools/AtvTool.java), com screenshots de cada passo.
on:
  push:
    paths:
      - "android/**"
      - "tools/AtvTool.java"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes do núcleo e APK
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Nome do APK
        run: cp app/build/outputs/apk/release/app-release.apk GoatRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoatRemote-apk
          path: android/GoatRemote.apk
          retention-days: 30

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: TV falsa
        run: |
          mkdir -p build/shots
          nohup java tools/AtvTool.java server build/tv > build/fake-tv.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:7000/state && break; sleep 1; done
          echo; cat build/fake-tv.log
      - name: Compilar antes do emulador
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ../build/failed
            adb pull /sdcard/Android/data/cc.slokker.goatremote.debug/files/shots ../build/ || true
            adb logcat -d -t 2000 > ../build/shots/logcat.txt || true
            test ! -f ../build/failed
      - name: Screenshots
        if: always()
        run: |
          cp build/fake-tv.log build/shots/ 2>/dev/null || true
          cp -r android/app/build/reports/androidTests build/shots/report 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/shots
          retention-days: 14
